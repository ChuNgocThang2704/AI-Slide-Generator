# Websocket upgrades need this mapping; "" keeps a plain request a plain request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    resolver 127.0.0.11 valid=10s ipv6=off;
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 100m;
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
    location /outputs/images/ {
        set $ai_upstream http://ai-service:8000;
        proxy_pass $ai_upstream;
        proxy_read_timeout 30s;
    }
    location /api/ {
        set $gateway_upstream http://api-gateway:8080;
        proxy_pass $gateway_upstream;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Second lock in front of the 9Router dashboard. The gateway itself is not published any more:
# reaching it from outside means passing this password first, and then its own login. The API
# that ai-service and ai-worker use is untouched — they call the container directly over the
# Docker network and never come through here.
server {
    resolver 127.0.0.11 valid=10s ipv6=off;
    listen 20128;
    client_max_body_size 32m;
    location / {
        auth_basic "9Router";
        auth_basic_user_file /etc/nginx/9router.htpasswd;
        set $nine_router http://9router:20128;
        proxy_pass $nine_router;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
