services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_TASK_TTL_SECONDS=${REDIS_TASK_TTL_SECONDS:-2592000}
      - FREE_CHAR_LIMIT=${FREE_CHAR_LIMIT:-10000}
      - PRO_CHAR_LIMIT=${PRO_CHAR_LIMIT:-50000}
      - ULTRA_CHAR_LIMIT=${ULTRA_CHAR_LIMIT:-100000}
      - FREE_SLIDE_LIMIT=${FREE_SLIDE_LIMIT:-10}
      - PRO_SLIDE_LIMIT_MAX=${PRO_SLIDE_LIMIT_MAX:-30}
      - ULTRA_SLIDE_LIMIT_MAX=${ULTRA_SLIDE_LIMIT_MAX:-50}
      - FREE_IMAGE_LIMIT=${FREE_IMAGE_LIMIT:-5}
      - PRO_IMAGE_LIMIT_MAX=${PRO_IMAGE_LIMIT_MAX:-15}
      - ULTRA_IMAGE_LIMIT_MAX=${ULTRA_IMAGE_LIMIT_MAX:-35}
      - IMAGE_MODEL_TYPE=${IMAGE_MODEL_TYPE:-flux}
      - IMAGE_GEN_API_BASE_URL=${IMAGE_GEN_API_BASE_URL:-http://host.docker.internal:8080}
      - IMAGE_SENSITIVE_ALLOW_FLUX=${IMAGE_SENSITIVE_ALLOW_FLUX:-true}
      - LLM_MODEL=${LLM_MODEL:-Qwen3-VL-8B}
      - VLLM_API_BASE_URL=${VLLM_API_BASE_URL:-}
      - VLLM_BASIC_AUTH_USER=${VLLM_BASIC_AUTH_USER:-}
      - VLLM_BASIC_AUTH_PASS=${VLLM_BASIC_AUTH_PASS:-}
      - SOURCE_RETRIEVAL_ENABLED=${SOURCE_RETRIEVAL_ENABLED:-true}
      - SOURCE_EMBEDDING_ENABLED=${SOURCE_EMBEDDING_ENABLED:-true}
      - SOURCE_EMBEDDING_MODEL=${SOURCE_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - SOURCE_RETRIEVAL_MIN_CONFIDENCE=${SOURCE_RETRIEVAL_MIN_CONFIDENCE:-0.62}
      - SOURCE_RETRIEVAL_MAX_PAGES=${SOURCE_RETRIEVAL_MAX_PAGES:-8}
      - SOURCE_EMBEDDING_CACHE_DIR=/app/.cache/fastembed
      - IMAGE_VLM_JUDGE_MODEL=${IMAGE_VLM_JUDGE_MODEL:-Qwen3-VL-8B}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./backend/service-account.json:/app/service-account.json:ro
      - embedding-cache:/app/.cache/fastembed
    depends_on:
      - redis

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/react-app:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "backend/worker.py"]
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_TASK_TTL_SECONDS=${REDIS_TASK_TTL_SECONDS:-2592000}
      - FREE_CHAR_LIMIT=${FREE_CHAR_LIMIT:-10000}
      - PRO_CHAR_LIMIT=${PRO_CHAR_LIMIT:-50000}
      - ULTRA_CHAR_LIMIT=${ULTRA_CHAR_LIMIT:-100000}
      - FREE_SLIDE_LIMIT=${FREE_SLIDE_LIMIT:-10}
      - PRO_SLIDE_LIMIT_MAX=${PRO_SLIDE_LIMIT_MAX:-30}
      - ULTRA_SLIDE_LIMIT_MAX=${ULTRA_SLIDE_LIMIT_MAX:-50}
      - FREE_IMAGE_LIMIT=${FREE_IMAGE_LIMIT:-5}
      - PRO_IMAGE_LIMIT_MAX=${PRO_IMAGE_LIMIT_MAX:-15}
      - ULTRA_IMAGE_LIMIT_MAX=${ULTRA_IMAGE_LIMIT_MAX:-35}
      - IMAGE_MODEL_TYPE=${IMAGE_MODEL_TYPE:-flux}
      - IMAGE_GEN_API_BASE_URL=${IMAGE_GEN_API_BASE_URL:-http://host.docker.internal:8080}
      - IMAGE_SENSITIVE_ALLOW_FLUX=${IMAGE_SENSITIVE_ALLOW_FLUX:-true}
      - LLM_MODEL=${LLM_MODEL:-Qwen3-VL-8B}
      - VLLM_API_BASE_URL=${VLLM_API_BASE_URL:-}
      - VLLM_BASIC_AUTH_USER=${VLLM_BASIC_AUTH_USER:-}
      - VLLM_BASIC_AUTH_PASS=${VLLM_BASIC_AUTH_PASS:-}
      - SOURCE_RETRIEVAL_ENABLED=${SOURCE_RETRIEVAL_ENABLED:-true}
      - SOURCE_EMBEDDING_ENABLED=${SOURCE_EMBEDDING_ENABLED:-true}
      - SOURCE_EMBEDDING_MODEL=${SOURCE_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - SOURCE_RETRIEVAL_MIN_CONFIDENCE=${SOURCE_RETRIEVAL_MIN_CONFIDENCE:-0.62}
      - SOURCE_RETRIEVAL_MAX_PAGES=${SOURCE_RETRIEVAL_MAX_PAGES:-8}
      - SOURCE_EMBEDDING_CACHE_DIR=/app/.cache/fastembed
      - IMAGE_VLM_JUDGE_MODEL=${IMAGE_VLM_JUDGE_MODEL:-Qwen3-VL-8B}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./backend/service-account.json:/app/service-account.json:ro
      - embedding-cache:/app/.cache/fastembed
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  frontend-node-modules:
  embedding-cache:
